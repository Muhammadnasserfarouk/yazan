<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>نوم يزن</title>
<meta name="description" content="متابعة نوم يزن ومواعيد علاجه">
<meta name="theme-color" content="#1f3157">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="نوم يزن">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-first column; a "night sky" status card on top, sections below, fixed tab bar at the bottom. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e4e9ef; --ink:#1a2331; --muted:#5a6676; --line:#d8dee6;
  --night:#2d4a7a; --night-soft:#d9e2f1; --nap:#d98a32; --nap-soft:#f6e3cb;
  --wake:#4f8a68; --wake-soft:#d8eadf; --warn:#b5651d; --bad:#b8452f; --bad-soft:#f4dcd6;
  --sky1:#1f3157; --sky2:#33507f; --skyink:#f3f6fb;
  --f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --sunk:#202935; --ink:#e7ecf3; --muted:#99a4b3; --line:#2a3441;
  --night:#86a5dc; --night-soft:#25324a; --nap:#eeac62; --nap-soft:#3d2f1e;
  --wake:#86c19f; --wake-soft:#1f3529; --warn:#e7a061; --bad:#ec8a74; --bad-soft:#3d2420;
  --sky1:#141f36; --sky2:#22355a; --skyink:#eef2f9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --sunk:#202935; --ink:#e7ecf3; --muted:#99a4b3; --line:#2a3441;
  --night:#86a5dc; --night-soft:#25324a; --nap:#eeac62; --nap-soft:#3d2f1e;
  --wake:#86c19f; --wake-soft:#1f3529; --warn:#e7a061; --bad:#ec8a74; --bad-soft:#3d2420;
  --sky1:#141f36; --sky2:#22355a; --skyink:#eef2f9; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:110px;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:20px}
h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--night);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:26px}
.age{font-size:13px;color:var(--muted)}

/* status card */
.sky{background:linear-gradient(160deg,var(--sky1),var(--sky2));color:var(--skyink);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.7}
.sky > *{position:relative}
.sky .state{font-family:var(--f-display);font-size:28px;line-height:1.2}
.sky .since{opacity:.85;font-size:14px}
.sky .hint{background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;font-size:14px}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
.big{flex:1 1 140px;border:0;border-radius:14px;padding:14px 16px;font-family:var(--f-display);font-size:19px;font-weight:700}
.big.nap{background:var(--nap-soft);color:#5b3510}
.big.night{background:#dfe7f6;color:#1d3359}
.big.wake{background:#e3f1e8;color:#1e4631}
.big.suggest{box-shadow:0 0 0 3px rgba(255,255,255,.75)}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;text-underline-offset:3px;padding:0;font-size:14px;opacity:.9}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:12px;color:var(--muted);letter-spacing:.2px}
.stat .v{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .s{font-size:12px;color:var(--muted)}

/* timeline */
.tl{direction:ltr;display:flex;flex-direction:column;gap:4px}
.tl .bar{position:relative;height:30px;border-radius:8px;background:var(--wake-soft);overflow:hidden}
.tl .seg{position:absolute;top:0;bottom:0}
.tl .seg.night{background:var(--night)}
.tl .seg.nap{background:var(--nap)}
.tl .nowline{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.tl .future{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(45deg,transparent 0 5px,var(--line) 5px 6px);background-color:var(--surface);opacity:.8}
.tl .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}

/* list */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.pill{font-size:12px;border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:500}
.pill.night{background:var(--night-soft);color:var(--night)}
.pill.nap{background:var(--nap-soft);color:var(--nap)}
.pill.ok{background:var(--wake-soft);color:var(--wake)}
.pill.warn{background:var(--nap-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.row .main{flex:1;min-width:0}
.row .main .t{font-variant-numeric:tabular-nums}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:13px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;background:var(--night);color:var(--surface)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ok{background:var(--wake);color:var(--surface)}

.day{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.day:first-of-type{border-top:0;padding-top:0}
.day .dh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.day .tl .bar{height:18px}

/* insights */
.ins{display:flex;flex-direction:column;gap:10px}
.insight{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:12px;border-radius:12px;background:var(--sunk)}
.insight .dot{width:10px;height:10px;border-radius:50%;margin-top:8px}
.insight .dot.ok{background:var(--wake)} .insight .dot.warn{background:var(--nap)} .insight .dot.bad{background:var(--bad)} .insight .dot.info{background:var(--night)}
.insight b{font-weight:600}
.insight p{margin:0;grid-column:2;color:var(--muted);font-size:14px}
.chartbox{overflow-x:auto}
.chartbox svg{display:block;width:100%;min-width:480px;height:auto}
.ref{width:100%;border-collapse:collapse;font-size:14px}
.ref td{padding:6px 0;border-top:1px solid var(--line)}
.ref td:last-child{text-align:left;font-variant-numeric:tabular-nums}
.ai{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px;font-size:14px}

/* forms */
form{display:flex;flex-direction:column;gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.seg-choice{display:flex;gap:8px}
.seg-choice label{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);font-size:14px;cursor:pointer}
.seg-choice input{width:auto}
.seg-choice label:has(input:checked){border-color:var(--night);background:var(--night-soft)}
.err{color:var(--bad);font-size:13px;min-height:1em}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet .sh{display:flex;justify-content:space-between;align-items:center}

/* bottom tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav.tabs button{border:0;background:none;border-radius:10px;padding:8px 2px;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--night);background:var(--night-soft);font-weight:600}

.banner{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.banner .main{flex:1;min-width:0;font-weight:600}
.note{background:var(--sunk);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;max-width:90vw}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.dose{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.dose:first-child{border-top:0}
.dose .tm{font-family:var(--f-display);font-size:18px;min-width:76px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="babyName">يزن ناصر</h1>
      <div class="age num" id="ageLine">دخّل تاريخ الميلاد من «البيانات»</div>
    </div>
  </header>

  <div id="medBanner" hidden></div>

  <section class="sky" id="sky" aria-live="polite">
    <canvas id="stars" aria-hidden="true"></canvas>
    <div>
      <div class="state" id="stateText">بنحمّل…</div>
      <div class="since num" id="sinceText"></div>
    </div>
    <div class="btnrow" id="actionRow"></div>
    <div class="hint num" id="nextHint" hidden></div>
    <div><button class="linkbtn" id="manualBtn" type="button">سجّل نومة فاتت بالمواعيد</button></div>
  </section>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="الأقسام">
  <div class="in">
    <button type="button" data-tab="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>النهارده</button>
    <button type="button" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg>السجل</button>
    <button type="button" data-tab="insights"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التحليل</button>
    <button type="button" data-tab="meds"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="8" width="18" height="8" rx="4" transform="rotate(-35 12 12)"/><path d="M9.2 7.9l5.6 8"/></svg>العلاج</button>
    <button type="button" data-tab="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>البيانات</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
const MIN=60000, HOUR=3600000, DAY=86400000;
const S={profile:{}, sleeps:[], meds:[], doses:{}, db:null, tab:'today', loaded:false, ro:false};
try{const t=localStorage.getItem('yz_tab'); if(t) S.tab=t;}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LOC='ar-EG-u-nu-latn';
const fmtTime=ms=>new Date(ms).toLocaleTimeString(LOC,{hour:'numeric',minute:'2-digit'});
const fmtDay=ms=>new Date(ms).toLocaleDateString(LOC,{weekday:'long',day:'numeric',month:'long'});
const fmtShortDay=ms=>new Date(ms).toLocaleDateString(LOC,{day:'numeric',month:'numeric'});
function dur(ms){ if(ms==null||isNaN(ms)) return '—'; ms=Math.max(0,ms); const h=Math.floor(ms/HOUR), m=Math.round((ms%HOUR)/MIN); if(m===60) return (h+1)+'س'; if(!h) return m+'د'; return m? `${h}س ${m}د` : `${h}س`; }
const hrs=ms=>(ms/HOUR).toFixed(1);
function sod(ms){const d=new Date(ms); d.setHours(0,0,0,0); return d.getTime();}
function addDays(ms,n){const d=new Date(ms); d.setDate(d.getDate()+n); return d.getTime();}
function dayKey(ms){const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function toInput(ms){const d=new Date(ms); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;}
function fromInput(v){ if(!v) return null; const t=new Date(v).getTime(); return isNaN(t)?null:t; }
function toast(msg){const r=$('#toastRoot'); r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>r.innerHTML='',3200);}
function minsOfDay(ms){const d=new Date(ms); return d.getHours()*60+d.getMinutes();}
function hm(min){ min=((Math.round(min)%1440)+1440)%1440; const d=new Date(); d.setHours(Math.floor(min/60),min%60,0,0); return fmtTime(d.getTime()); }

/* ---------- age & reference ---------- */
function ageParts(){
  const b=S.profile.birthDate; if(!b) return null;
  const bd=new Date(b+'T00:00'); if(isNaN(bd)) return null;
  const now=new Date(); let m=(now.getFullYear()-bd.getFullYear())*12+(now.getMonth()-bd.getMonth());
  let anchor=new Date(bd); anchor.setMonth(bd.getMonth()+m);
  if(anchor>now){m--; anchor=new Date(bd); anchor.setMonth(bd.getMonth()+m);}
  const days=Math.floor((sod(now.getTime())-sod(anchor.getTime()))/DAY);
  return {months:m, days, totalDays:Math.floor((sod(now.getTime())-bd.getTime())/DAY)};
}
function ageText(a){ if(!a) return null; const m=a.months, d=a.days;
  const ms= m===0?'':(m===1?'شهر':(m===2?'شهرين':(m<=10?`${m} شهور`:`${m} شهر`)));
  const ds= d===0?'':(d===1?'يوم':(d===2?'يومين':(d<=10?`${d} أيام`:`${d} يوم`)));
  return [ms,ds].filter(Boolean).join(' و ')||'مولود النهارده'; }
// Guidance ranges (AASM total sleep for 4–12m: 12–16h incl. naps; wake windows & nap counts are common pediatric sleep guidance)
function ref(){
  const a=ageParts(); const m=a?a.months:8;
  if(m<3)  return {label:'0–3 شهور',ww:[45,90],naps:[4,5],total:[14,17],night:[8,10],known:!!a};
  if(m<6)  return {label:'3–5 شهور',ww:[90,150],naps:[3,4],total:[12,16],night:[10,11],known:!!a};
  if(m<8)  return {label:'6–7 شهور',ww:[120,180],naps:[2,3],total:[12,16],night:[10,12],known:!!a};
  if(m<11) return {label:'8–10 شهور',ww:[150,210],naps:[2,2],total:[12,16],night:[10,12],known:!!a};
  if(m<15) return {label:'11–14 شهر',ww:[180,240],naps:[1,2],total:[11,14],night:[10,12],known:!!a};
  return {label:'15–24 شهر',ww:[240,360],naps:[1,1],total:[11,14],night:[10,12],known:!!a};
}

/* ---------- sleep math ---------- */
function sorted(){ return S.sleeps; } // kept ascending by start
function ongoing(){ const a=S.sleeps; for(let i=a.length-1;i>=0;i--) if(a[i].end==null) return a[i]; return null; }
function isNightWaking(i){ const a=S.sleeps, s=a[i], n=a[i+1]; return !!(s && s.kind==='night' && s.end!=null && n && n.kind==='night' && n.start>=s.end && n.start-s.end<4*HOUR); }
function dayStats(d0){
  const d1=addDays(d0,1), now=Date.now(), a=S.sleeps;
  const r={d0,night:0,nap:0,naps:0,shortNaps:0,wakings:0,wakeups:0,longest:0,ww:[],lastWW:null,bedtime:null,any:false};
  a.forEach((s,i)=>{
    const e=s.end??now;
    const ov=Math.max(0,Math.min(e,d1,now)-Math.max(s.start,d0));
    if(ov>0) r.any=true;
    if(s.kind==='nap') r.nap+=ov; else r.night+=ov;
    if(s.kind==='nap'&&s.start>=d0&&s.start<d1){r.naps++; if(s.end!=null&&s.end-s.start<45*MIN) r.shortNaps++;}
    if(s.end!=null&&s.end>=d0&&s.end<d1){ r.wakeups++; if(isNightWaking(i)) r.wakings++; }
    if(s.kind==='night'&&s.end!=null&&s.end>=d0&&s.end<d1) r.longest=Math.max(r.longest,s.end-s.start);
    // wake windows that end (next sleep starts) inside this day
    const p=a[i-1];
    if(p&&p.end!=null&&s.start>=d0&&s.start<d1&&!isNightWaking(i-1)){
      const g=s.start-p.end; if(g>=10*MIN&&g<9*HOUR){ r.ww.push(g); if(s.kind==='night') r.lastWW=g; }
    }
    // bedtime: night sleep starting between 17:00 and 03:00 that is not a resume after a night waking
    if(s.kind==='night'&&s.start>=d0+17*HOUR&&s.start<d1+3*HOUR&&!(p&&isNightWaking(i-1))&&r.bedtime==null) r.bedtime=s.start;
  });
  r.total=r.night+r.nap; return r;
}
function avg(xs){ xs=xs.filter(x=>x!=null&&!isNaN(x)); return xs.length? xs.reduce((s,x)=>s+x,0)/xs.length : null; }

/* ---------- data layer ---------- */
/* Everything is stored on this phone (localStorage). Same tiny API as before: doc(path).set/update/delete, collection(name).add */
const STORE_KEY='yazan_data_v1';
let D=null;
function blank(){ return {v:1, baby:{profile:{name:'يزن ناصر'}}, sleeps:{}, meds:{}, doses:{}}; }
function loadStore(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(STORE_KEY)); }catch(e){}
  if(!d||typeof d!=='object') d=blank();
  ['baby','sleeps','meds','doses'].forEach(k=>{ if(!d[k]||typeof d[k]!=='object') d[k]={}; });
  if(!d.baby.profile) d.baby.profile={name:'يزن ناصر'};
  D=d; syncState();
}
function persist(){
  try{ localStorage.setItem(STORE_KEY,JSON.stringify(D)); localStorage.setItem('yazan_last_saved',String(Date.now())); }
  catch(e){ throw {code:'quota_exceeded'}; }
  syncState(); renderAll();
}
function syncState(){
  S.profile={...D.baby.profile};
  S.sleeps=Object.entries(D.sleeps).map(([id,v])=>({id,...v})).filter(s=>typeof s.start==='number').sort((a,b)=>a.start-b.start);
  S.meds=Object.entries(D.meds).map(([id,v])=>({id,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
  const m={}; Object.entries(D.doses).forEach(([id,v])=>m[id]={id,...v}); S.doses=m;
}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const localDb={
  doc(path){ const [c,id]=path.split('/'); return {
    set:async v=>{ D[c][id]=JSON.parse(JSON.stringify(v)); persist(); },
    update:async v=>{ if(!D[c][id]) throw {code:'invalid_argument'}; D[c][id]={...D[c][id],...JSON.parse(JSON.stringify(v))}; persist(); },
    delete:async()=>{ delete D[c][id]; persist(); } }; },
  collection(c){ return { add:async v=>{ const id=uid(); D[c][id]=JSON.parse(JSON.stringify(v)); persist(); return localDb.doc(c+'/'+id); } }; }
};
function initDb(){
  loadStore(); S.db=localDb; S.loaded=true;
  try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}
  // keep two open copies (e.g. Safari + home-screen) in sync
  window.addEventListener('storage',e=>{ if(e.key===STORE_KEY){ loadStore(); renderAll(); } });
  renderAll();
}
async function write(fn, okMsg){
  if(!S.db){ toast('الحفظ مش متاح.'); return false; }
  try{ await fn(S.db); if(okMsg) toast(okMsg); return true; }
  catch(e){ console.warn(e);
    if(e&&e.code==='invalid_argument'){ toast('مش مسموح لك تعدّل في السجل ده.'); }
    else if(e&&e.code==='quota_exceeded'){ toast('مساحة التخزين اتملت. اعمل نسخة احتياطية وامسح سجلات قديمة.'); }
    else toast('ماتحفظش. جرّب تاني.');
    return false; }
}
function suggestedKind(t=Date.now()){ const h=new Date(t).getHours(); return (h>=18||h<6)?'night':'nap'; }
async function startSleep(kind){
  if(ongoing()){ toast('فيه نومة شغالة بالفعل.'); return; }
  const now=Date.now();
  await write(db=>db.collection('sleeps').add({start:now,end:null,kind,note:'',createdAt:now}), kind==='nap'?'اتسجلت القيلولة. نوم هادي!':'اتسجل نوم الليل. تصبح على خير!');
}
async function endSleep(){
  const o=ongoing(); if(!o) return;
  const now=Date.now();
  await write(db=>db.doc('sleeps/'+o.id).update({end:Math.max(now,o.start+MIN)}), `صحي بعد ${dur(now-o.start)}`);
}

/* ---------- status card ---------- */
function renderStatus(){
  const o=ongoing(), a=S.sleeps, now=Date.now(), name=(S.profile.name||'يزن ناصر').split(' ')[0];
  const st=$('#stateText'), si=$('#sinceText'), row=$('#actionRow'), hint=$('#nextHint');
  if(!S.loaded){ st.textContent='بنحمّل…'; si.textContent=''; row.innerHTML=''; hint.hidden=true; return; }
  if(o){
    st.textContent = o.kind==='nap' ? `${name} في قيلولة` : `${name} نايم`;
    si.textContent = `من ${fmtTime(o.start)} · بقاله ${dur(now-o.start)}`;
    row.innerHTML = `<button class="big wake" type="button" id="bWake" ${S.ro?'disabled':''}>صحي دلوقتي</button>`;
    $('#bWake').onclick=endSleep;
    hint.hidden=true;
  } else {
    const last=a.length? a[a.length-1] : null;
    st.textContent = `${name} صاحي`;
    si.textContent = last&&last.end ? `من ${fmtTime(last.end)} · بقاله ${dur(now-last.end)}` : 'لسه مفيش نومات متسجلة. ابدأ من الزرار تحت.';
    const sk=suggestedKind();
    row.innerHTML = `<button class="big nap ${sk==='nap'?'suggest':''}" type="button" id="bNap" ${S.ro?'disabled':''}>نام قيلولة</button>
                     <button class="big night ${sk==='night'?'suggest':''}" type="button" id="bNight" ${S.ro?'disabled':''}>نام بالليل</button>`;
    $('#bNap').onclick=()=>startSleep('nap'); $('#bNight').onclick=()=>startSleep('night');
    // next sleep hint
    if(last&&last.end&&now-last.end<10*HOUR){
      const R=ref(); const morning=last.kind==='night';
      const lo=last.end+(morning? R.ww[0]-15 : R.ww[0])*MIN, hi=last.end+(morning? R.ww[0]+30 : R.ww[1])*MIN;
      const awake=now-last.end;
      let txt;
      if(now<lo) txt=`النومة الجاية غالباً بين ${fmtTime(lo)} و ${fmtTime(hi)} (فترة الصحيان المناسبة لسنّه ${dur(R.ww[0]*MIN)}–${dur(R.ww[1]*MIN)}).`;
      else if(now<=hi) txt=`ده وقت مناسب للنوم دلوقتي. راقب علامات النعاس: فرك العين، التثاؤب، السرحان.`;
      else txt=`صاحي بقاله ${dur(awake)}، وده أطول من المناسب لسنّه. ممكن يكون مرهق، فخلّي جو النوم هادي وابدأ التنويم.`;
      if(!R.known) txt+=' (دخّل تاريخ الميلاد عشان المواعيد تبقى أدق.)';
      hint.textContent=txt; hint.hidden=false;
    } else hint.hidden=true;
  }
}

/* ---------- timeline ---------- */
function timeline(d0, opts={}){
  const d1=addDays(d0,1), now=Date.now();
  let segs='';
  S.sleeps.forEach(s=>{ const e=s.end??now; const a=Math.max(s.start,d0), b=Math.min(e,d1,now); if(b>a){ segs+=`<div class="seg ${s.kind}" style="left:${(a-d0)/DAY*100}%;width:${Math.max(.3,(b-a)/DAY*100)}%"></div>`; } });
  let extra='';
  if(now>d0&&now<d1){ const p=(now-d0)/DAY*100; extra=`<div class="future" style="left:${p}%"></div><div class="nowline" style="left:${p}%"></div>`; }
  const ticks = opts.ticks===false?'':`<div class="ticks num"><span>12ص</span><span>3ص</span><span>6ص</span><span>9ص</span><span>12م</span><span>3م</span><span>6م</span><span>9م</span><span>12ص</span></div>`;
  return `<div class="tl" role="img" aria-label="خط النوم لليوم"><div class="bar">${segs}${extra}</div>${ticks}</div>`;
}
const legend=`<div class="legend"><span><i style="background:var(--night)"></i>نوم الليل</span><span><i style="background:var(--nap)"></i>قيلولة</span><span><i style="background:var(--wake-soft);border:1px solid var(--line)"></i>صاحي</span></div>`;

function sessionRow(s){

  const k=s.kind==='nap'?'<span class="pill nap">قيلولة</span>':'<span class="pill night">ليل</span>';
  const range = `${fmtTime(s.start)} ← ${s.end?fmtTime(s.end):'لسه نايم'}`;
  return `<div class="row">${k}<div class="main"><div class="t">${range}</div><div class="small muted">${dur(e-s.start)}${s.note?' · '+esc(s.note):''}</div></div>${S.ro?'':`<button class="iconbtn" type="button" data-edit="${esc(s.id)}">تعديل</button>`}</div>`;
}

      else if(mww<R.ww[0]*MIN*0.85) list.push(['info',`فترات الصحيان قصيرة (${dur(mww)} في المتوسط)`,`لو بياخد وقت طويل على ما ينام أو بيقاوم النوم، ممكن يكون لسه مش تعبان كفاية. جرّب تطوّل فترة الصحيان ١٥ دقيقة.`]);
      else list.push(['ok',`فترات الصحيان مناسبة (${dur(mww)} في المتوسط)`,`جوه المعدل المناسب لسنّه ${dur(R.ww[0]*MIN)}–${dur(R.ww[1]*MIN)}.`]);
      if(lastWW&&lastWW>(R.ww[1]+30)*MIN) list.push(['warn',`الفترة من آخر قيلولة لنوم الليل طويلة (${dur(lastWW)})`,'لو بيزن أو بيصحى بدري الصبح، جرّب تقدّم نوم الليل أو تأخّر القيلولة الأخيرة شوية.']);

  }
  html+=`<section class="card"><div class="section-head"><h2>ملاحظات وتوصيات</h2><span class="small muted">من آخر ${use.length||0} ${use.length===1?'يوم':'أيام'} متسجلة</span></div><div class="ins">${list.map(([c,t,p])=>`<div class="insight"><span class="dot ${c}"></span><b>${esc(t)}</b><p>${esc(p)}</p></div>`).join('')}</div></section>`;

  return html;
}
function chart14(R){

  const y=h=>pt+ih-(h/max)*ih;
  let g=`<rect x="${pl}" y="${y(R.total[1])}" width="${iw}" height="${y(R.total[0])-y(R.total[1])}" fill="var(--wake-soft)"/>`;
  [0,6,12,18].forEach(h=>{ g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(h)}" y2="${y(h)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(h)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${h}س</text>`; });
  for(let i=0;i<n;i++){
    const d=addDays(d0,-(n-1-i)), s=dayStats(d), x=pl+i*bw+bw*0.18, w=bw*0.64;
    const nh=s.night/HOUR, ph=s.nap/HOUR, isToday=i===n-1;
    if(s.any){
      g+=`<rect x="${x}" y="${y(nh)}" width="${w}" height="${Math.max(0,y(0)-y(nh))}" rx="2" fill="var(--night)" ${isToday?'opacity=".55"':''}><title>${fmtShortDay(d)}: ليل ${dur(s.night)}</title></rect>`;
      g+=`<rect x="${x}" y="${y(nh+ph)}" width="${w}" height="${Math.max(0,y(nh)-y(nh+ph))}" rx="2" fill="var(--nap)" ${isToday?'opacity=".55"':''}><title>${fmtShortDay(d)}: قيلولات ${dur(s.nap)}</title></rect>`;
      g+=`<text x="${x+w/2}" y="${y(nh+ph)-4}" text-anchor="middle" font-size="10" fill="var(--ink)">${hrs(s.total)}</text>`;
    }
    g+=`<text x="${x+w/2}" y="${H-12}" text-anchor="middle" font-size="10" fill="${isToday?'var(--ink)':'var(--muted)'}">${isToday?'النهارده':fmtShortDay(d)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="رسم بياني لساعات النوم اليومية" style="direction:ltr">${g}</svg>`;
}

/* ---------- meds ---------- */
function medActiveOn(m, key){ if(m.active===false) return false; if(m.startDate&&key<m.startDate) return false; if(m.endDate&&key>m.endDate) return false; return true; }
function todayDoses(){
  const key=dayKey(Date.now()), now=new Date(), nowMin=now.getHours()*60+now.getMinutes(), out=[];
  S.meds.forEach(m=>{ if(!medActiveOn(m,key)) return; (m.times||[]).forEach(t=>{
    const [h,mi]=t.split(':').map(Number); const tm=h*60+mi; const id=`${m.id}_${key}_${t.replace(':','')}`;
    const taken=S.doses[id];
    let state= taken?'taken' : (nowMin>=tm+60?'late': (nowMin>=tm-10?'due':'later'));
    out.push({m,t,tm,id,key,taken,state});
  }); });
  return out.sort((a,b)=>a.tm-b.tm);
}
function doseRow(d){
  const pill={taken:'<span class="pill ok">اتاخد</span>',late:'<span class="pill bad">متأخر</span>',due:'<span class="pill warn">ميعاده دلوقتي</span>',later:'<span class="pill night">لسه</span>'}[d.state];
  const btn = S.ro? '' : (d.taken? `<button class="iconbtn" type="button" data-undose="${esc(d.id)}">تراجع</button>` : `<button class="btn ok" type="button" data-dose="${esc(d.id)}">اداه</button>`);
  return `<div class="dose"><span class="tm">${hm(d.tm)}</span><div class="main" style="flex:1;min-width:0"><div><b>${esc(d.m.name)}</b>${d.m.dose?' · '+esc(d.m.dose):''}</div><div class="small muted">${pill}${d.taken?' الساعة '+fmtTime(d.taken.takenAt):''}</div></div>${btn}</div>`;
}
function todayDosesCard(compact){
  const ds=todayDoses(); if(compact&&!ds.length) return '';
  return `<section class="card"><div class="section-head"><h2>جرعات النهارده</h2>${compact?'':'<span class="small muted num">'+ds.filter(d=>d.taken).length+' من '+ds.length+'</span>'}</div>${ds.length?`<div>${ds.map(doseRow).join('')}</div>`:'<div class="empty">مفيش جرعات النهارده.</div>'}</section>`;
}

  else html+=`<div class="list">${S.meds.map(m=>{ const key=dayKey(Date.now()); const on=medActiveOn(m,key);

    return `<div class="row"><span class="pill ${on?'ok':'night'}">${on?'شغال':'موقوف'}</span><div class="main"><div><b>${esc(m.name)}</b>${m.dose?' · '+esc(m.dose):''}</div><div class="small muted num">${(m.times||[]).map(t=>hm(t.split(':')[0]*60+ +t.split(':')[1])).join('، ')} · ${per}${m.notes?' · '+esc(m.notes):''}</div></div>${S.ro?'':`<button class="iconbtn" type="button" data-editmed="${esc(m.id)}">تعديل</button>`}</div>`; }).join('')}</div>`;

  html+=`<section class="card"><h3>التنبيهات</h3>

    ${notifBlock()}
    <label style="flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:14px"><input type="checkbox" id="sndToggle" style="width:auto" ${snd?'checked':''}> شغّل صوت تنبيه مع ميعاد الجرعة</label>
  </section>`;
  return html;

/* ---------- sheets ---------- */
function closeSheet(){ $('#sheetRoot').innerHTML=''; }
function sheet(title, body){
  $('#sheetRoot').innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sh"><h2>${esc(title)}</h2><button class="iconbtn" type="button" id="shClose">إغلاق</button></div>${body}</div></div>`;
  $('#shClose').onclick=closeSheet; $('#scrim').onclick=e=>{ if(e.target.id==='scrim') closeSheet(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

function openSleepSheet(s){
  if(S.ro) return;
  const now=Date.now(); const isNew=!s;
  const st=s? s.start : now-HOUR, en=s? s.end : now, kind=s? s.kind : suggestedKind(now-HOUR);
  sheet(isNew?'تسجيل نومة':'تعديل النومة', `<form id="slForm">
    <div class="seg-choice"><label><input type="radio" name="kind" value="nap" ${kind==='nap'?'checked':''}> قيلولة</label><label><input type="radio" name="kind" value="night" ${kind==='night'?'checked':''}> نوم الليل</label></div>
    <div class="grid2"><label>نام الساعة<input id="slStart" type="datetime-local" value="${toInput(st)}" required></label>
    <label>صحي الساعة<input id="slEnd" type="datetime-local" value="${en?toInput(en):''}"></label></div>
    <div class="small muted">سيب «صحي الساعة» فاضي لو لسه نايم.</div>
    <label>ملاحظة (اختياري)<input id="slNote" value="${esc(s?.note||'')}" placeholder="مثلاً: كان بيسنّن، نام على الرضعة…"></label>
    <div class="err" id="slErr"></div>
    <div class="btnrow"><button class="btn" type="submit">احفظ</button>${isNew?'':'<button class="btn danger" type="button" id="slDel">امسح</button>'}</div>
  </form>`);
  $('#slForm').onsubmit=async ev=>{ ev.preventDefault();
    const a=fromInput($('#slStart').value), b=fromInput($('#slEnd').value), k=document.querySelector('input[name=kind]:checked').value, err=$('#slErr');
    if(a==null){ err.textContent='حدد وقت النوم.'; return; }
    if(a>Date.now()+MIN){ err.textContent='وقت النوم ماينفعش يبقى في المستقبل.'; return; }
    if(b!=null&&b<=a){ err.textContent='وقت الصحيان لازم يبقى بعد وقت النوم.'; return; }
    if(b!=null&&b-a>16*HOUR){ err.textContent='النومة أطول من ١٦ ساعة. راجع التاريخ.'; return; }
    if(b==null){ const o=ongoing(); if(o&&(!s||o.id!==s.id)){ err.textContent='فيه نومة تانية لسه شغالة. اقفلها الأول أو حط وقت صحيان.'; return; } }
    const overlap=S.sleeps.find(x=>(!s||x.id!==s.id)&&a<(x.end??Date.now())&&(b??Date.now())>x.start);
    if(overlap){ err.textContent=`الوقت ده متداخل مع نومة تانية (${fmtTime(overlap.start)}). عدّلها هي الأول.`; return; }
    const body={start:a,end:b,kind:k,note:$('#slNote').value.trim()};
    const ok= isNew? await write(db=>db.collection('sleeps').add({...body,createdAt:Date.now()}),'اتسجلت.') : await write(db=>db.doc('sleeps/'+s.id).update(body),'اتعدلت.');
    if(ok) closeSheet();
  };
  const del=$('#slDel'); if(del){ let armed=false; del.onclick=async()=>{ if(!armed){ armed=true; del.textContent='متأكد؟ دوس تاني للمسح'; return; } if(await write(db=>db.doc('sleeps/'+s.id).delete(),'اتمسحت.')) closeSheet(); }; }
}

function openMedSheet(m){
  if(S.ro) return;
  const isNew=!m, times=(m?.times?.length? m.times : ['09:00']);
  let days=''; if(m?.endDate&&m?.startDate){ days=Math.round((new Date(m.endDate+'T00:00')-new Date(m.startDate+'T00:00'))/DAY)+1; }
  sheet(isNew?'إضافة دوا':'تعديل الدوا', `<form id="mdForm">

    <div class="grid2"><label>يبدأ من<input id="mdStart" type="date" value="${esc(m?.startDate||dayKey(Date.now()))}"></label>
    <label>لمدة كام يوم<input id="mdDays" type="number" min="1" inputmode="numeric" value="${days}" placeholder="فاضي = مستمر"></label></div>

    <div class="err" id="mdErr"></div>
    <div class="btnrow"><button class="btn" type="submit">احفظ</button>${isNew?'':'<button class="btn danger" type="button" id="mdDel">امسح الدوا</button>'}</div>

  const bindRm=()=>document.querySelectorAll('[data-rmt]').forEach(b=>b.onclick=()=>{ if(document.querySelectorAll('.tIn').length>1) b.parentElement.remove(); });
  bindRm();
  $('#mdAddT').onclick=()=>{ if(document.querySelectorAll('.tIn').length>=8) return; $('#mdTimes').insertAdjacentHTML('beforeend',timeInput('')); bindRm(); };
  $('#mdForm').onsubmit=async ev=>{ ev.preventDefault(); const err=$('#mdErr');

    const body={name,dose:$('#mdDose').value.trim(),times:ts,startDate:sd,endDate,notes:$('#mdNotes').value.trim(),active: isNew?true:$('#mdActive').checked};
    const ok= isNew? await write(db=>db.collection('meds').add({...body,createdAt:Date.now()}),'اتضاف الدوا.') : await write(db=>db.doc('meds/'+m.id).update(body),'اتعدل الدوا.');
    if(ok) closeSheet();
  };
  const del=$('#mdDel'); if(del){ let armed=false; del.onclick=async()=>{ if(!armed){ armed=true; del.textContent='متأكد؟ دوس تاني للمسح'; return; } if(await write(db=>db.doc('meds/'+m.id).delete(),'اتمسح الدوا.')) closeSheet(); }; }
}
function timeInput(v){ return `<div style="display:flex;gap:8px"><input class="tIn" type="time" value="${esc(v)}" aria-label="ميعاد الجرعة"><button class="iconbtn" type="button" data-rmt aria-label="شيل الميعاد">شيل</button></div>`; }

/* ---------- reminders ---------- */
let lastBeeped={};
function checkReminders(){
  const due=todayDoses().filter(d=>d.state==='due'||d.state==='late');
  const b=$('#medBanner');
  if(!due.length){ b.hidden=true; b.innerHTML=''; document.title='نوم يزن ناصر'; return; }
  const d=due[0];
  b.hidden=false;
  b.innerHTML=`<div class="banner" role="alert"><div class="main">${d.state==='late'?'جرعة متأخرة':'ميعاد العلاج'}: ${esc(d.m.name)}${d.m.dose?' · '+esc(d.m.dose):''} (${hm(d.tm)})${due.length>1?` و ${due.length-1} كمان`:''}</div>${S.ro?'':`<button class="btn ok" type="button" id="bnDose">اداه</button>`}</div>`;
  const bd=$('#bnDose'); if(bd) bd.onclick=()=>markDose(d.id);
  document.title='(ميعاد علاج) نوم يزن';
  let snd=false; try{snd=localStorage.getItem('yz_sound')==='1';}catch(e){}
  if(snd&&!lastBeeped[d.id]){ lastBeeped[d.id]=1; beep(); }
  due.forEach(x=>notifyDose(x));
}
let actx=null;
function beep(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const t=actx.currentTime;
  [0,0.35,0.7].forEach(o=>{ const g=actx.createGain(), os=actx.createOscillator(); os.type='sine'; os.frequency.value=880; g.gain.setValueAtTime(0.0001,t+o); g.gain.exponentialRampToValueAtTime(0.25,t+o+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+o+0.28); os.connect(g).connect(actx.destination); os.start(t+o); os.stop(t+o+0.3); });
}catch(e){} }
document.addEventListener('pointerdown',()=>{ try{ if(actx&&actx.state==='suspended') actx.resume(); }catch(e){} },{passive:true});

/* ---------- standalone / notifications / backup ---------- */
function isStandalone(){ return window.navigator.standalone===true || (window.matchMedia&&matchMedia('(display-mode: standalone)').matches); }
function notifState(){ return ('Notification' in window)? Notification.permission : 'unsupported'; }
function notifBlock(){
  const st=notifState();
  if(st==='granted') return '<div class="note">الإشعارات شغالة.</div>';
  if(st==='denied') return '<div class="note">الإشعارات مقفولة. تقدر تفتحها من الإعدادات ← الإشعارات ← نوم يزن.</div>';
  if(st==='unsupported') return `<div class="note">${isStandalone()?'الموبايل ده مش بيدعم إشعارات تطبيقات الويب (محتاج iOS 16.4 أو أحدث).':'عشان الإشعارات تشتغل على الآيفون، ثبّت التطبيق على الشاشة الرئيسية الأول (الطريقة في قسم «البيانات») وافتحه من الأيقونة.'}</div>`;
  return '<div class="btnrow"><button class="btn" type="button" id="notifBtn">فعّل الإشعارات</button></div>';
}
async function enableNotifs(){
  try{ const r=await Notification.requestPermission(); toast(r==='granted'?'تمام، الإشعارات اشتغلت.':'الإشعارات ماتفعلتش.'); }catch(e){ toast('معرفتش أفعّل الإشعارات.'); }
  renderView();
}
function notifiedSet(){ try{ return JSON.parse(localStorage.getItem('yz_notified')||'{}'); }catch(e){ return {}; } }
async function notifyDose(d){
  if(notifState()!=='granted') return;
  const seen=notifiedSet(); if(seen[d.id]) return;
  seen[d.id]=Date.now();
  const cutoff=Date.now()-3*DAY; Object.keys(seen).forEach(k=>{ if(seen[k]<cutoff) delete seen[k]; });
  try{ localStorage.setItem('yz_notified',JSON.stringify(seen)); }catch(e){}
  const title=`ميعاد علاج يزن: ${d.m.name}`, body=`${d.m.dose?d.m.dose+' · ':''}الساعة ${hm(d.tm)}`;
  try{ const reg=await navigator.serviceWorker?.ready; if(reg){ await reg.showNotification(title,{body,tag:d.id,icon:'icons/icon-192.png',badge:'icons/icon-192.png'}); return; } }catch(e){}
  try{ new Notification(title,{body,tag:d.id}); }catch(e){}
}
function lastBackupText(){ let t=null; try{ t=+localStorage.getItem('yz_last_backup'); }catch(e){} return t? ` آخر نسخة: ${new Date(t).toLocaleDateString(LOC,{day:'numeric',month:'long'})}.` : ' لسه ماعملتش أي نسخة.'; }
async function exportBackup(){
  const name=`yazan-backup-${dayKey(Date.now())}.json`;
  const blob=new Blob([JSON.stringify({app:'yazan-sleep',exportedAt:new Date().toISOString(),data:D},null,1)],{type:'application/json'});
  const file=new File([blob],name,{type:'application/json'});
  let done=false;
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'نسخة احتياطية - نوم يزن'}); done=true; } }
  catch(e){ if(e&&e.name==='AbortError') return; }
  if(!done){ const u=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
  try{ localStorage.setItem('yz_last_backup',String(Date.now())); }catch(e){}
  toast('اتعملت النسخة الاحتياطية.'); renderView();
}
async function importBackup(f){
  const err=$('#bkErr'); if(!f) return;
  try{
    const j=JSON.parse(await f.text()); const d=j&&j.data;
    if(!d||typeof d!=='object'||!d.sleeps||!d.baby) throw 0;
    const n=Object.keys(d.sleeps).length;
    const btn=$('#bkImport'); err.textContent=`النسخة فيها ${n} نومة. الاستعادة هتمسح البيانات الحالية وتحط النسخة مكانها.`;
    btn.textContent='تأكيد الاستعادة'; btn.onclick=()=>{ D=d; ['baby','sleeps','meds','doses'].forEach(k=>{ if(!D[k]) D[k]={}; }); try{ persist(); toast('اترجعت البيانات من النسخة.'); }catch(e){ toast('ماتحفظتش.'); } };
  }catch(e){ err.textContent='الملف ده مش نسخة احتياطية من التطبيق.'; }
  $('#bkFile').value='';
}

/* ---------- tabs & loop ---------- */
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{ S.tab=b.dataset.tab; try{localStorage.setItem('yz_tab',S.tab);}catch(e){} renderView(); window.scrollTo({top:0}); });
$('#manualBtn').onclick=()=>openSleepSheet(null);
setInterval(()=>{ renderStatus(); checkReminders(); if(S.tab==='today'&&!$('#sheetRoot').innerHTML&&!$('#view').contains(document.activeElement)) renderView(); },30000);

/* stars */
(function(){ const c=$('#stars'); const ctx=c.getContext('2d'); function draw(){ const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1; c.width=r.width*dpr; c.height=r.height*dpr; ctx.scale(dpr,dpr); ctx.clearRect(0,0,r.width,r.height);
  let seed=7; const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<46;i++){ const x=rnd()*r.width, y=rnd()*r.height, s=rnd()*1.3+.3; ctx.fillStyle=`rgba(255,255,255,${.25+rnd()*.5})`; ctx.beginPath(); ctx.arc(x,y,s,0,Math.PI*2); ctx.fill(); }
  ctx.fillStyle='rgba(255,240,210,.9)'; ctx.beginPath(); ctx.arc(46,40,16,0,Math.PI*2); ctx.fill(); ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--sky1'); ctx.beginPath(); ctx.arc(54,34,14,0,Math.PI*2); ctx.fill(); }
  draw(); window.addEventListener('resize',draw); })();

initDb();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e))); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ renderStatus(); checkReminders(); if(!$('#sheetRoot').innerHTML) renderView(); } });
})();
</script>
